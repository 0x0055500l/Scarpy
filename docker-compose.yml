version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - LLM_MODEL=openai/gpt-4o-mini
      - LLM_API_KEY=${LLM_API_KEY:-your_api_key_here}
      - BROWSER_HEADLESS=true
      - BROWSER_TIMEOUT=30000
    volumes:
      - ./agent.db:/app/agent.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

